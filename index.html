<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111a2e"><title>Color Memory</title>
<link rel="stylesheet" href="./style.css">
</head>
<body><main>
<header class="top"><div class="brand"><span class="brand-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>COLOR ARCADE</div></header>
<h1>🎨 Color Memory</h1><p class="subtitle">🧠 Watch the lights. Repeat the pattern!</p>
<section class="scorebar" aria-label="Scores"><div class="metric"><small>Level / 50</small><strong id="round">00</strong></div><div class="divider"></div><div class="metric"><small>Best</small><strong id="best">00</strong></div></section>
<div class="mode"><span class="mode-label">Mode</span><div class="levels" aria-label="Choose difficulty"><button class="level selected" data-level="easy" aria-pressed="true">Easy</button><button class="level" data-level="medium" aria-pressed="false">Medium</button><button class="level" data-level="difficult" aria-pressed="false">Hard</button></div></div>
<p id="message" role="status" aria-live="polite"><i class="lamp"></i><span>✨ Tap start to play!</span></p>
<div class="game-shell"><div class="board" aria-label="Color buttons"><button class="tile green" data-tile="0" aria-label="Green" disabled></button><button class="tile red" data-tile="1" aria-label="Red" disabled></button><button class="tile yellow" data-tile="2" aria-label="Yellow" disabled></button><button class="tile blue" data-tile="3" aria-label="Blue" disabled></button></div><div class="hub"><b>SIMON</b><span>memory game</span></div></div>
<div class="track" id="track" aria-label="Level progress"></div><div class="actions"><button id="start">▶ &nbsp; Start game</button><button class="pause" id="pause" disabled>Ⅱ Pause</button><button class="stop" id="stop" disabled>■ Stop</button></div><p class="tip">Repeat the sequence to climb each level</p>
</main>
<script src="./script.js" defer></script></body></html>
